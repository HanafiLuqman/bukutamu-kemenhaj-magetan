<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buku Tamu Kemenhaj Magetan</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#391E10">
<style>
:root{--hd:#391E10;--g:#734128;--gt:#FFFAE6;--gold:#FFCF00;--bg:#FFFAE6;--c:#FFFFFF;--t:#391E10;--m:#734128;--l:#E2CEB1;--r:#9B2C1D}
@media(prefers-color-scheme:dark){:root:not([data-t]){--bg:#261F00;--c:#391E10;--t:#FFFAE6;--m:#E2CEB1;--l:#734128;--g:#FFCF00;--gt:#261F00;--hd:#000;--r:#FF8A75}}
:root[data-t=dark]{--bg:#261F00;--c:#391E10;--t:#FFFAE6;--m:#E2CEB1;--l:#734128;--g:#FFCF00;--gt:#261F00;--hd:#000;--r:#FF8A75}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:8px;background:var(--c);margin-top:4px}
label{display:block;margin:0 0 12px;font-size:.9rem;color:var(--m)}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:none}
.b{background:var(--g);color:var(--gt);font-weight:600}.b2{border:1px solid var(--l);background:var(--c)}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0);z-index:10}
#nav a{flex:1;text-align:center;padding:14px 4px;font-size:.88rem;color:var(--m);cursor:pointer}
#nav a.on{color:var(--g);font-weight:700;box-shadow:inset 0 3px var(--gold)}
#top{position:fixed;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0 12px;display:flex;align-items:center;gap:10px;background:var(--hd);color:#FFFAE6;border-bottom:3px solid var(--gold);z-index:15}
#logo{width:38px;height:38px;border-radius:8px;background:#fff;padding:3px;object-fit:contain}
.tt{flex:1;line-height:1.2}.tt b{display:block}.tt small{opacity:.8;font-size:.78rem}
.ib{color:#FFFAE6;width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:8px}
.menu{position:fixed;right:10px;top:calc(60px + env(safe-area-inset-top,0px));background:var(--c);border:1px solid var(--l);border-radius:12px;padding:8px;width:230px;z-index:16;box-shadow:0 6px 20px #0004}
.menu>button{display:block;width:100%;text-align:left;padding:12px;color:var(--t)}.menu small{color:var(--m);padding:4px 4px;display:block}
.seg{display:flex;gap:4px;padding:4px 0 8px}.seg button{flex:1;border:1px solid var(--l);padding:8px 2px;font-size:.85rem;color:var(--t)}.seg button.on{background:var(--g);color:var(--gt);border-color:var(--g)}
body.sel #fab{display:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
main{padding:calc(70px + env(safe-area-inset-top,0px)) 14px calc(150px + env(safe-area-inset-bottom,0));max-width:760px;margin:0 auto}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{margin:0}.bar input[type=date]{width:auto}
.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--c);border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.r.x{opacity:.55}.m{flex:1;min-width:150px}.m b{display:block}.m span{color:var(--m);font-size:.88rem}
.chip{background:var(--bg);border-radius:20px;padding:1px 8px;margin-left:6px;font-size:.78rem}
time{color:var(--m);font-size:.85rem}.a{width:100%;display:flex;gap:8px}.a button{border:1px solid var(--l);padding:8px 14px}.a .d{color:var(--r)}
.e{text-align:center;color:var(--m);padding:36px 12px}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));height:52px;padding:0 22px;border-radius:26px;background:var(--gold);color:#261F00;font-weight:700;box-shadow:0 3px 10px #0004;z-index:11;white-space:nowrap}#fab span{font-size:1.5rem;margin-right:6px;vertical-align:-2px}
.sh{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.card{background:var(--c);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
.card h3{margin:0 0 12px}.row{display:flex;gap:8px}.row button{flex:1}
dl{margin:0 0 14px}dt{font-size:.8rem;color:var(--m);margin-top:8px}dd{margin:0}
.ph{width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin-bottom:8px}.th{height:64px;border-radius:8px;vertical-align:middle;margin-right:8px}
#cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#cam video,#cam img{flex:1;min-height:0;width:100%;object-fit:contain}#cam .row{padding:14px}
.lock{position:fixed;inset:0;background:var(--hd);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--c);padding:24px;border-radius:14px;width:100%;max-width:340px}.box h2{margin:0 0 4px}.box p{margin:0 0 10px;color:var(--m)}.box button{width:100%;margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0));background:#261F00;color:#FFEFAC;border:1px solid #C9A300;padding:10px 16px;border-radius:8px;z-index:50;max-width:90%}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin:10px 0}th,td{border-bottom:1px solid var(--l);padding:6px;text-align:left}
.tw{overflow-x:auto}
.ck{width:22px;height:22px;margin:0;flex:none}
#bulk{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0));background:var(--c);border-top:1px solid var(--l);padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:12}#bulk b{flex:1}
.lnk{background:none;color:var(--m);text-decoration:underline;width:100%;padding:8px}
.note{background:#FFEFAC;border:1px solid #C9A300;color:#391E10;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}.note span{flex:1}
.st{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px 14px;margin-bottom:12px}.st small{color:var(--m);display:block;margin-bottom:6px}
.st .n{display:flex}.st .n div{flex:1}.st .n div+div{border-left:1px solid var(--l);padding-left:14px}.st b{font-size:1.5rem;line-height:1.1;display:block}.st span{color:var(--m);font-size:.82rem}
@media(min-width:820px){
#nav{top:56px;bottom:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--l);padding-top:12px}
#nav a{text-align:left;padding:12px 20px}#nav a.on{box-shadow:inset 3px 0 var(--gold)}

main{margin-left:210px;max-width:none;padding:80px 28px 100px}main>section{max-width:820px}
#fab{bottom:24px;left:calc(50% + 105px)}#toast{bottom:30px}#bulk{left:210px;bottom:0}.sh{align-items:center}.card{border-radius:16px}}
@media print{#top,#nav,#fab,.bar,.noprint,#p-data,#p-kelola{display:none!important}main{margin:0;padding:0}}
</style></head><body>
<div id="lock" class="lock"><div class="box"><h2 id="lt">Buku Tamu</h2><p id="ls"></p><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><button id="pb" class="b">Masuk</button><button class="lnk" id="lupa">Lupa PIN?</button><div id="lr" hidden><input id="rc" placeholder="Kode pemulihan" autocapitalize="characters"><input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="PIN baru" style="margin-top:8px"><button class="b" id="rb">Atur ulang PIN</button></div></div></div>
<header id="top"><img id="logo" src="logo.svg" alt="Logo"><div class="tt"><b>Buku Tamu</b><small>Kemenhaj Magetan</small></div>
<button class="ib" id="kunci2" aria-label="Kunci aplikasi"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
<button class="ib" id="gear" aria-label="Pengaturan"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></header>
<div id="menu" class="menu" hidden><small>Tema tampilan</small><div class="seg"><button data-t="light">Terang</button><button data-t="dark">Gelap</button><button data-t="">Sistem</button></div><button id="upin">Ubah PIN</button><button id="kunci">Kunci aplikasi</button></div>
<nav id="nav"><a data-p="data" class="on">Tamu</a><a data-p="kelola">Kelola</a><a data-p="lapor">Laporan</a></nav>
<main>
<section id="p-data"><div id="st" class="st"></div><div id="bn2" class="note" hidden></div><div class="bar"><input id="q" placeholder="Cari nama tamu"><input id="d" type="date"></div><div id="l1"></div></section>
<section id="p-kelola" hidden><div class="bar"><input id="q2" placeholder="Cari nama tamu"><input id="d2" type="date" title="Sampai tanggal"></div><label><input id="td" type="checkbox" style="width:auto;margin:0 6px 0 0">Tampilkan hanya data terhapus (untuk dipulihkan atau dimusnahkan)</label><label id="ca" hidden style="color:var(--t);font-weight:600"><input id="cka" type="checkbox" class="ck" style="display:inline-block;vertical-align:middle;margin-right:8px"><span id="cat"></span></label><div id="l2"></div></section>
<section id="p-lapor" hidden><div class="bar noprint"><label style="flex:1">Dari<input id="lf" type="date"></label><label style="flex:1">Sampai<input id="lu" type="date"></label></div>
<b id="cn"></b><div class="tw"><table id="rt"></table></div>
<div class="row noprint"><button id="xr" class="b">Export Excel</button><button id="pr" class="b2">Cetak / PDF</button></div>
<p class="noprint" style="color:var(--m);font-size:.88rem">Backup lengkap berisi semua data teks (termasuk yang terhapus) dan riwayat perubahan. Foto tidak ikut. Simpan file backup di tempat aman, misalnya Google Drive kantor.</p>
<button id="xb" class="b2 noprint" style="width:100%">Backup lengkap (Excel)</button><input id="fi" type="file" accept=".xlsx" hidden><button id="xi" class="b2 noprint" style="width:100%;margin-top:8px">Pulihkan dari backup (Excel)</button><button id="xh" class="b2 noprint" style="width:100%;margin-top:8px">Riwayat perubahan</button></section>
</main>
<button id="fab" aria-label="Tambah tamu"><span>+</span>Tambah Tamu</button>
<div id="bulk" hidden><b id="bn"></b><button class="b2" id="bp">Pulihkan</button><button class="b" id="bm" style="background:var(--r)">Hapus permanen</button></div>
<div id="sh" class="sh" hidden><div class="card" id="shc"></div></div>
<div id="cam" hidden><video id="cv" autoplay playsinline muted></video><img id="cp" hidden alt="Hasil foto">
<div class="row" id="c1"><button class="b" id="snap">Jepret</button><button class="b2" id="flip">Ganti kamera</button><button class="b2" id="cx">Batal</button></div>
<div class="row" id="c2" hidden><button class="b2" id="redo">Ulangi</button><button class="b" id="use">Pakai foto ini</button></div></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===== Daftar pilihan (ubah di sini). Disimpan sebagai teks, jadi aman diubah/ditambah. =====
const KAT=['Jemaah / masyarakat umum','Instansi / dinas lain','Travel / biro perjalanan / KBIHU','Lainnya (kurir, rekanan, dll)'];
const BAG=['Pimpinan / Kepala Kantor','Tata Usaha / Umum','Pendaftaran dan Berkas Haji','Dokumen dan Visa','Bimbingan dan Manasik','Umrah dan Haji Khusus','Informasi / Pengaduan','Lainnya'];
const KEP=['Setor berkas / dokumen','Ambil paspor / dokumen','Cek status pendaftaran','Tanya informasi','Bimbingan / manasik','Konsultasi / pengaduan','Rapat / audiensi','Antar surat / paket','Lainnya'];
const KEC=['Barat','Bendo','Karangrejo','Karas','Kartoharjo','Kawedanan','Lembeyan','Magetan','Maospati','Ngariboyo','Nguntoronadi','Panekan','Parang','Plaosan','Poncol','Sidorejo','Sukomoro','Takeran','Luar Magetan'];

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uuid=()=>crypto.randomUUID(),now=()=>new Date(Date.now()+252e5).toISOString().replace('Z','+07:00');
const fmt=i=>new Date(i).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}

// ===== Penyimpanan lokal (IndexedDB) =====
const DB=new Promise((ok,no)=>{const r=indexedDB.open('bukutamu',1);r.onupgradeneeded=()=>{['tamu','foto','log'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.result.createObjectStore('set',{keyPath:'k'})};r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})};
const all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));

let data=[],pendingFoto=null,shot=null,stream=null,face='environment',sel=new Set(),kl=[],noClose=false;
async function load(){data=(await all('tamu')).sort((a,b)=>b.waktu_masuk.localeCompare(a.waktu_masuk));render();banner()}

// ===== Tampilan daftar =====
function row(t,k){return `<div class="r${t.dihapus_pada?' x':''}" data-id="${t.id}">${k&&t.dihapus_pada?`<input type="checkbox" class="ck"${sel.has(t.id)?' checked':''}>`:''}<div class="m"><b>${esc(t.nama)}</b><span>${esc(t.kecamatan||t.instansi||t.kategori)}</span>${t.jumlah>1?`<span class="chip">${t.jumlah} orang</span>`:''}</div><time>${fmt(t.waktu_masuk)}</time>${k?`<div class="a">${t.dihapus_pada?'<button data-a="pulih">Pulihkan</button>':'<button data-a="edit">Edit</button><button data-a="hapus" class="d">Hapus</button>'}</div>`:''}</div>`}
function render(){const hr=now().slice(0,10),ac=data.filter(t=>!t.dihapus_pada);$('#st').innerHTML=`<small>${new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small><div class="n"><div><b>${ac.filter(t=>t.waktu_masuk.startsWith(hr)).length}</b><span>Tamu hari ini</span></div><div><b>${ac.filter(t=>t.waktu_masuk.startsWith(hr.slice(0,7))).length}</b><span>Tamu bulan ini</span></div></div>`;
 const q=$('#q').value.toLowerCase(),d=$('#d').value;
 const a=data.filter(t=>!t.dihapus_pada&&(!d||t.waktu_masuk.startsWith(d))&&t.nama.toLowerCase().includes(q));
 $('#l1').innerHTML=a.map(t=>row(t)).join('')||`<p class="e">Belum ada tamu${d?' pada tanggal ini':''}. Tekan + untuk mencatat tamu.</p>`;
 const q2=$('#q2').value.toLowerCase(),sd=$('#td').checked,d2=$('#d2').value,b=data.filter(t=>!!t.dihapus_pada===sd&&t.nama.toLowerCase().includes(q2)&&(!d2||t.waktu_masuk.slice(0,10)<=d2));kl=b;[...sel].forEach(i=>{if(!b.some(t=>t.id===i))sel.delete(i)});
 $('#l2').innerHTML=(sd?b:b.slice(0,100)).map(t=>row(t,1)).join('')||'<p class="e">Data tidak ditemukan.</p>';
 $('#ca').hidden=!sd||!b.length;$('#cat').textContent=`Centang semua (${b.length} data)`;$('#cka').checked=sd&&b.length>0&&sel.size===b.length;$('#bulk').hidden=!sd||!sel.size;$('#bn').textContent=sel.size+' dipilih';document.body.classList.toggle('sel',!$('#bulk').hidden);
 renderLapor()}
const sheet=h=>{$('#shc').innerHTML=h;$('#sh').hidden=false;const x=$('#bx');if(x)x.onclick=close};
const close=()=>{$('#sh').hidden=true;noClose=false};
$('#sh').onclick=e=>{if(e.target.id==='sh'&&!noClose)close()};
async function detail(id){
 const t=data.find(x=>x.id===id),f=t.ada_foto?await get('foto',id):null;
 sheet(`<h3>${esc(t.nama)}</h3>${f?`<img class="ph" alt="Foto tamu" src="${URL.createObjectURL(f.blob)}">`:''}<dl>${[['Waktu masuk',fmt(t.waktu_masuk)],['Kategori',t.kategori],['Instansi',t.instansi],['Kecamatan',t.kecamatan],['No. HP',t.no_hp],['Bagian dituju',t.bagian],['Keperluan',t.keperluan],['Catatan',t.catatan],['Jumlah orang',t.jumlah]].filter(x=>x[1]).map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><button class="b2" id="bx" style="width:100%">Tutup</button>`)}
document.addEventListener('click',async e=>{
 const r=e.target.closest('.r');if(!r)return;const id=r.dataset.id,a=e.target.dataset.a,t=data.find(x=>x.id===id);
 if(e.target.classList.contains('ck')){e.target.checked?sel.add(id):sel.delete(id);return render()}
 if(!a)return detail(id);
 if(a==='edit')return form(id);
 if(a==='hapus'){sheet(`<h3>Hapus data tamu?</h3><p>${esc(t.nama)} akan disembunyikan dari daftar. Data masih tersimpan dan bisa dipulihkan.</p><div class="row"><button class="b2" id="bx">Batal</button><button class="b" id="ok" style="background:var(--r)">Hapus</button></div>`);$('#ok').onclick=()=>mark(t,now());}
 if(a==='pulih')mark(t,'')});
async function mark(t,v){const n=now();await put('log',{id:uuid(),waktu:n,aksi:v?'hapus':'pulih',tamu_id:t.id,sebelum:JSON.stringify(t)});t.dihapus_pada=v;t.diubah_pada=n;await put('tamu',t);close();toast(v?'Data dihapus.':'Data dipulihkan.');load()}

// ===== Form tambah / edit =====
const opt=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
function form(id){
 const t=id?data.find(x=>x.id===id):{},e=!!id;pendingFoto=null;
 sheet(`<h3>${e?'Edit data tamu':'Tambah tamu'}</h3>
 <label>Nama *<input id="f_nama" list="dl" value="${esc(t.nama)}" autocomplete="off"></label><datalist id="dl">${[...new Set(data.filter(x=>!x.dihapus_pada).map(x=>x.nama))].slice(0,300).map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <label>Kategori tamu *<select id="f_kat">${opt(KAT,t.kategori)}</select></label>
 <label id="w_ins">Nama instansi<input id="f_ins" value="${esc(t.instansi)}"></label>
 <label>Kecamatan asal<select id="f_kec"><option value="">Pilih kecamatan</option>${opt(KEC,t.kecamatan)}</select></label>
 <label>No. HP (opsional)<input id="f_hp" inputmode="tel" value="${esc(t.no_hp)}"></label>
 <label>Bagian yang dituju<select id="f_bag">${opt(BAG,t.bagian)}</select></label>
 <label>Keperluan<select id="f_kep">${opt(KEP,t.keperluan)}</select></label>
 <label>Catatan (opsional)<input id="f_cat" value="${esc(t.catatan)}"></label>
 <label>Jumlah orang<input id="f_jml" type="number" min="1" value="${t.jumlah||1}"></label>
 ${e?'':'<div id="fotoBox" style="margin-bottom:14px"><button class="b2" id="bf" style="width:100%">Ambil foto (opsional)</button></div>'}
 <div class="row"><button class="b2" id="bx">Batal</button><button class="b" id="bs">Simpan</button></div>`);
 const sync=()=>{$('#w_ins').hidden=$('#f_kat').value===KAT[0]};$('#f_kat').onchange=sync;sync();
 if(!e)$('#bf').onclick=camOpen;
 if(!e)$('#f_nama').onchange=()=>{const p=data.find(x=>!x.dihapus_pada&&x.nama.toLowerCase()===$('#f_nama').value.trim().toLowerCase());if(p){$('#f_kat').value=p.kategori;$('#f_ins').value=p.instansi;$('#f_kec').value=p.kecamatan;$('#f_hp').value=p.no_hp;sync()}};
 $('#bs').onclick=()=>save(id)}
async function save(id){
 const v=k=>$('#f_'+k).value.trim(),o={nama:v('nama'),kategori:v('kat'),instansi:v('ins'),kecamatan:v('kec'),no_hp:v('hp'),bagian:v('bag'),keperluan:v('kep'),catatan:v('cat'),jumlah:Math.max(1,+v('jml')||1)};
 if(!o.nama)return toast('Isi nama tamu.');
 if(o.kategori===KAT[0]){o.instansi='';if(!o.kecamatan)return toast('Pilih kecamatan asal.')}
 const n=now();let t;
 if(id){t=data.find(x=>x.id===id);await put('log',{id:uuid(),waktu:n,aksi:'edit',tamu_id:id,sebelum:JSON.stringify(t)});Object.assign(t,o,{diubah_pada:n})}

async function newRec(){const c=rcode();await put('set',{k:'rec',h:await hash(c)});sheet(`<h3>Kode pemulihan</h3><p>Catat kode ini dan simpan di tempat aman. Kode dipakai untuk mengatur ulang PIN jika lupa, dan tidak akan ditampilkan lagi.</p><p style="font:700 1.4rem/1.3 ui-monospace,monospace;letter-spacing:.06em;text-align:center">${c}</p><button class="b2" id="cc" style="width:100%;margin-bottom:8px">Salin kode</button><button class="b" id="bx" style="width:100%">Sudah saya catat</button>`);noClose=true;$('#cc').onclick=async()=>{try{await navigator.clipboard.writeText(c);toast('Kode disalin. Tempel ke tempat penyimpanan yang aman.')}catch{toast('Gagal menyalin. Catat kode secara manual.')}}}

 if(!rows||!m||!m[0]||m[0].format!=='bukutamu-v1'||+m[0].jumlah_baris!==rows.length)return toast('File ini bukan backup Buku Tamu yang valid atau sudah diubah.');
 const have=new Set(data.map(t=>t.id));let ok=0,sk=0,bad=0;const S=x=>String(x??'');
 for(const r of rows){if(!r.id||!r.nama||!r.waktu_masuk){bad++;continue}if(have.has(S(r.id))){sk++;continue}
  await put('tamu',{id:S(r.id),nama:S(r.nama),kategori:S(r.kategori),instansi:S(r.instansi),kecamatan:S(r.kecamatan),no_hp:S(r.no_hp),bagian:S(r.bagian),keperluan:S(r.keperluan),catatan:S(r.catatan),jumlah:Math.max(1,+r.jumlah||1),waktu_masuk:S(r.waktu_masuk),dibuat_pada:S(r.dibuat_pada),diubah_pada:S(r.diubah_pada),dihapus_pada:S(r.dihapus_pada),ada_foto:0});ok++}
 const hl=new Set((await all('log')).map(l=>l.id));for(const l of J('Log')||[])if(l.id&&!hl.has(l.id))await put('log',l);

async function riwayat(){
 const L=(await all('log')).sort((a,b)=>a.waktu.localeCompare(b.waktu)),F=['nama','kategori','instansi','kecamatan','no_hp','bagian','keperluan','catatan','jumlah'],P=l=>{try{return JSON.parse(l.sebelum)}catch{return null}},o=[];
 L.forEach((l,i)=>{if(l.aksi==='musnah')return o.push([l.waktu,`${l.jumlah} data dimusnahkan permanen`]);
  const b=P(l),A={edit:'Diubah',hapus:'Dihapus',pulih:'Dipulihkan'}[l.aksi]||l.aksi;
  if(!b)return o.push([l.waktu,`${A}: (data sudah dimusnahkan)`]);

  const nx=L.slice(i+1).find(x=>x.tamu_id===l.tamu_id&&P(x)),a=nx?P(nx):data.find(x=>x.id===l.tamu_id),
  d=a?F.filter(k=>String(b[k]??'')!==String(a[k]??'')).map(k=>`${k}: ${esc(b[k]||'-')} → ${esc(a[k]||'-')}`):[];
  o.push([l.waktu,`Diubah: ${esc(b.nama)}${d.length?'<br><small>'+d.join('<br>')+'</small>':''}`])});
 sheet(`<h3>Riwayat perubahan</h3>${o.reverse().slice(0,100).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--l)"><time>${fmt(x[0])}</time><div>${x[1]}</div></div>`).join('')||'<p class="e">Belum ada perubahan.</p>'}<button class="b2" id="bx" style="width:100%;margin-top:12px">Tutup</button>`)}
