<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Buku Tamu Kemenhaj Magetan</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#391E10">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="lock" class="lock">
        <div class="box"><img class="lg" src="logo-full.png" alt="Buku Tamu">
            <h2 id="lt">Buku Tamu</h2>
            <p id="ls"></p><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><button
                id="pb" class="b">Masuk</button><button class="lnk" id="lupa">Lupa PIN?</button>
            <div id="lr" hidden><input id="rc" placeholder="Kode pemulihan" autocapitalize="characters"><input id="np"
                    type="password" inputmode="numeric" maxlength="8" placeholder="PIN baru"
                    style="margin-top:8px"><button class="b" id="rb">Atur ulang PIN</button></div>
        </div>
    </div>
    <header id="top"><img id="logo" src="logo.png" alt="Logo Buku Tamu">
        <div class="tt"><b>Buku Tamu</b><small>Kemenhaj Magetan</small></div>
        <button class="ib" id="kunci2" aria-label="Kunci aplikasi"><svg viewBox="0 0 24 24" width="22" height="22"
                fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="11" width="14" height="9" rx="2" />
                <path d="M8 11V8a4 4 0 018 0v3" />
            </svg></button>
        <button class="ib" id="gear" aria-label="Pengaturan"><svg viewBox="0 0 24 24" width="22" height="22"
                fill="currentColor">
                <circle cx="12" cy="5" r="2" />
                <circle cx="12" cy="12" r="2" />
                <circle cx="12" cy="19" r="2" />
            </svg></button>
    </header>
    <div id="menu" class="menu" hidden><small>Tema tampilan</small>
        <div class="seg"><button data-t="light">Terang</button><button data-t="dark">Gelap</button><button
                data-t="">Sistem</button></div>
        <hr><small id="lb2"></small>
        <button id="xb">Backup lengkap (Excel)</button><button id="xi">Pulihkan dari backup (Excel)</button><button
            id="xh">Riwayat perubahan</button>
        <hr><button id="upin">Ubah PIN</button><button id="kunci">Kunci aplikasi</button><small id="ver"
            style="padding:8px 4px 2px"></small>
    </div>
    <nav id="nav"><a data-p="data" class="on">Tamu</a><a data-p="kelola">Kelola</a><a data-p="lapor">Laporan</a></nav>
    <main>
        <section id="p-data">
            <div id="st" class="st"></div>
            <div id="bn2" class="note" hidden></div>
            <div class="bar"><input id="q" placeholder="Cari nama tamu"><input id="d" type="date"></div>
            <div id="l1"></div>
        </section>
        <section id="p-kelola" hidden>
            <div class="bar"><input id="q2" placeholder="Cari nama tamu"></div>
            <div class="dr"><label>Dari<input id="d1" type="date"></label><label>Sampai<input id="d2"
                        type="date"></label><button class="lnk" id="dc" style="grid-column:1/-1;padding:0 0 4px">Hapus
                    filter tanggal</button></div><label><input id="td" type="checkbox"
                    style="width:auto;margin:0 6px 0 0">Tampilkan data terhapus</label><label id="ca" hidden style="color:var(--t);font-weight:600"><input id="cka"
                    type="checkbox" class="ck" style="display:inline-block;vertical-align:middle;margin-right:8px"><span
                    id="cat"></span></label>
            <div id="l2"></div>
        </section>
        <section id="p-lapor" hidden>
            <div class="dr noprint"><label>Dari<input id="lf" type="date"></label><label>Sampai<input id="lu"
                        type="date"></label></div>
            <div class="row noprint" style="margin-bottom:10px"><button id="xr" class="b">Export Excel</button><button
                    id="pr" class="b2">Cetak / PDF</button></div>
            <div id="kop"></div><b id="cn"></b>
            <div class="tw">
                <table id="rt"></table>
            </div>
        </section>
    </main>
    <button id="fab" aria-label="Tambah tamu"><span>+</span>Tambah Tamu</button>
    <div id="bulk" hidden><b id="bn"></b><button class="b2" id="bp">Pulihkan</button><button class="b" id="bm"
            style="background:var(--r)">Hapus permanen</button></div>
    <div id="sh" class="sh" hidden>
        <div class="card" id="shc"></div>
    </div>
    <div id="cam" hidden><video id="cv" autoplay playsinline muted></video><img id="cp" hidden alt="Hasil foto">
        <div class="row" id="c1">
            <button class="b2" id="flip"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
            <button class="b" id="snap"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
            <button class="b2" id="cx">Batal</button></div>
        <div class="row" id="c2" hidden><button class="b2" id="redo">Ulangi</button><button class="b" id="use">Pakai
                foto ini</button></div>
    </div>
    <div id="toast" hidden></div>
    <input id="fi" type="file" accept=".xlsx" hidden>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
