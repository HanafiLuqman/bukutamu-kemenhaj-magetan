<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buku Tamu Kemenhaj Magetan</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0e5a47">
<style>
:root{--g:#0e5a47;--gold:#c8962e;--bg:#f3f4f0;--c:#fff;--t:#1c2723;--m:#66726c;--l:#dde2dc;--r:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#111613;--c:#1a211d;--t:#e6ebe7;--m:#9aa6a0;--l:#2b342f;--g:#3fa488}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:8px;background:var(--c);margin-top:4px}
label{display:block;margin:0 0 12px;font-size:.9rem;color:var(--m)}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:none}
.b{background:var(--g);color:#fff;font-weight:600}.b2{border:1px solid var(--l);background:var(--c)}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0);z-index:10}
#nav a{flex:1;text-align:center;padding:14px 4px;font-size:.88rem;color:var(--m);cursor:pointer}
#nav a.on{color:var(--g);font-weight:700;box-shadow:inset 0 3px var(--g)}
.brand{display:none}
main{padding:14px 14px calc(150px + env(safe-area-inset-bottom,0));max-width:760px;margin:0 auto}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{margin:0}.bar input[type=date]{width:auto}
.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--c);border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.r.x{opacity:.55}.m{flex:1;min-width:150px}.m b{display:block}.m span{color:var(--m);font-size:.88rem}
.chip{background:var(--bg);border-radius:20px;padding:1px 8px;margin-left:6px;font-size:.78rem}
time{color:var(--m);font-size:.85rem}.a{width:100%;display:flex;gap:8px}.a button{border:1px solid var(--l);padding:8px 14px}.a .d{color:var(--r)}
.e{text-align:center;color:var(--m);padding:36px 12px}
#fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0));width:58px;height:58px;border-radius:50%;background:var(--gold);color:#1c1400;font-size:2rem;line-height:1;box-shadow:0 3px 10px #0004;z-index:11;padding:0}
.sh{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.card{background:var(--c);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
.card h3{margin:0 0 12px}.row{display:flex;gap:8px}.row button{flex:1}
dl{margin:0 0 14px}dt{font-size:.8rem;color:var(--m);margin-top:8px}dd{margin:0}
.ph{width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin-bottom:8px}.th{height:64px;border-radius:8px;vertical-align:middle;margin-right:8px}
#cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#cam video,#cam img{flex:1;min-height:0;width:100%;object-fit:contain}#cam .row{padding:14px}
.lock{position:fixed;inset:0;background:var(--g);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--c);padding:24px;border-radius:14px;width:100%;max-width:340px}.box h2{margin:0 0 4px}.box p{margin:0 0 10px;color:var(--m)}.box button{width:100%;margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0));background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;max-width:90%}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin:10px 0}th,td{border-bottom:1px solid var(--l);padding:6px;text-align:left}
.tw{overflow-x:auto}
@media(min-width:820px){
#nav{top:0;bottom:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--l);padding-top:12px}
#nav a{text-align:left;padding:12px 20px}#nav a.on{box-shadow:inset 3px 0 var(--g)}
.brand{display:block;padding:8px 20px 16px;font-size:1.05rem}.brand small{display:block;color:var(--m);font-weight:400;font-size:.8rem}
main{margin-left:210px;max-width:none;padding:24px 28px 100px}main>section{max-width:820px}
#fab{bottom:24px}#toast{bottom:30px}.sh{align-items:center}.card{border-radius:16px}}
@media print{#nav,#fab,.bar,.noprint,#p-data,#p-kelola{display:none!important}main{margin:0;padding:0}}
</style></head><body>
<div id="lock" class="lock"><div class="box"><h2 id="lt">Buku Tamu</h2><p id="ls"></p><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><button id="pb" class="b">Masuk</button></div></div>
<nav id="nav"><b class="brand">Buku Tamu<small>Kemenhaj Magetan</small></b><a data-p="data" class="on">Data Tamu</a><a data-p="kelola">Kelola Data</a><a data-p="lapor">Laporan</a><a id="kunci">Kunci</a></nav>
<main>
<section id="p-data"><div class="bar"><input id="q" placeholder="Cari nama tamu"><input id="d" type="date"></div><div id="l1"></div></section>
<section id="p-kelola" hidden><div class="bar"><input id="q2" placeholder="Cari nama tamu"><label style="margin:0;white-space:nowrap;align-self:center"><input id="td" type="checkbox" style="width:auto;margin-right:4px">Terhapus</label></div><div id="l2"></div></section>
<section id="p-lapor" hidden><div class="bar noprint"><label style="flex:1">Dari<input id="lf" type="date"></label><label style="flex:1">Sampai<input id="lu" type="date"></label></div>
<b id="cn"></b><div class="tw"><table id="rt"></table></div>
<div class="row noprint"><button id="xr" class="b">Export Excel</button><button id="pr" class="b2">Cetak / PDF</button></div>
<p class="noprint" style="color:var(--m);font-size:.88rem">Backup lengkap berisi semua data teks (termasuk yang terhapus) dan riwayat perubahan. Foto tidak ikut. Simpan file backup di tempat aman, misalnya Google Drive kantor.</p>
<button id="xb" class="b2 noprint" style="width:100%">Backup lengkap (Excel)</button></section>
</main>
<button id="fab" aria-label="Tambah tamu">+</button>
<div id="sh" class="sh" hidden><div class="card" id="shc"></div></div>
<div id="cam" hidden><video id="cv" autoplay playsinline muted></video><img id="cp" hidden alt="Hasil foto">
<div class="row" id="c1"><button class="b" id="snap">Jepret</button><button class="b2" id="flip">Ganti kamera</button><button class="b2" id="cx">Batal</button></div>
<div class="row" id="c2" hidden><button class="b2" id="redo">Ulangi</button><button class="b" id="use">Pakai foto ini</button></div></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===== Daftar pilihan (ubah di sini). Disimpan sebagai teks, jadi aman diubah/ditambah. =====
const KAT=['Jemaah / masyarakat umum','Instansi / dinas lain','Travel / biro perjalanan / KBIHU','Lainnya (kurir, rekanan, dll)'];
const BAG=['Pimpinan / Kepala Kantor','Tata Usaha / Umum','Pendaftaran dan Berkas Haji','Dokumen dan Visa','Bimbingan dan Manasik','Umrah dan Haji Khusus','Informasi / Pengaduan','Lainnya'];
const KEP=['Setor berkas / dokumen','Ambil paspor / dokumen','Cek status pendaftaran','Tanya informasi','Bimbingan / manasik','Konsultasi / pengaduan','Rapat / audiensi','Antar surat / paket','Lainnya'];
const KEC=['Barat','Bendo','Karangrejo','Karas','Kartoharjo','Kawedanan','Lembeyan','Magetan','Maospati','Ngariboyo','Nguntoronadi','Panekan','Parang','Plaosan','Poncol','Sidorejo','Sukomoro','Takeran','Luar Magetan'];

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uuid=()=>crypto.randomUUID(),now=()=>new Date(Date.now()+252e5).toISOString().replace('Z','+07:00');
const fmt=i=>new Date(i).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}

// ===== Penyimpanan lokal (IndexedDB) =====
const DB=new Promise((ok,no)=>{const r=indexedDB.open('bukutamu',1);r.onupgradeneeded=()=>{['tamu','foto','log'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.result.createObjectStore('set',{keyPath:'k'})};r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)})};
const all=s=>tx(s,'readonly',o=>o.getAll()),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v));

let data=[],pendingFoto=null,shot=null,stream=null,face='environment';
async function load(){data=(await all('tamu')).sort((a,b)=>b.waktu_masuk.localeCompare(a.waktu_masuk));render()}

// ===== Tampilan daftar =====
function row(t,k){return `<div class="r${t.dihapus_pada?' x':''}" data-id="${t.id}"><div class="m"><b>${esc(t.nama)}</b><span>${esc(t.kecamatan||t.instansi||t.kategori)}</span>${t.jumlah>1?`<span class="chip">${t.jumlah} orang</span>`:''}</div><time>${fmt(t.waktu_masuk)}</time>${k?`<div class="a">${t.dihapus_pada?'<button data-a="pulih">Pulihkan</button>':'<button data-a="edit">Edit</button><button data-a="hapus" class="d">Hapus</button>'}</div>`:''}</div>`}
function render(){
 const q=$('#q').value.toLowerCase(),d=$('#d').value;
 const a=data.filter(t=>!t.dihapus_pada&&(!d||t.waktu_masuk.startsWith(d))&&t.nama.toLowerCase().includes(q));
 $('#l1').innerHTML=a.map(t=>row(t)).join('')||`<p class="e">Belum ada tamu${d?' pada tanggal ini':''}. Tekan + untuk mencatat tamu.</p>`;
 const q2=$('#q2').value.toLowerCase(),sd=$('#td').checked;
 $('#l2').innerHTML=data.filter(t=>(sd||!t.dihapus_pada)&&t.nama.toLowerCase().includes(q2)).slice(0,100).map(t=>row(t,1)).join('')||'<p class="e">Data tidak ditemukan.</p>';
 renderLapor()}
const sheet=h=>{$('#shc').innerHTML=h;$('#sh').hidden=false;const x=$('#bx');if(x)x.onclick=close};
const close=()=>{$('#sh').hidden=true};
$('#sh').onclick=e=>{if(e.target.id==='sh')close()};
async function detail(id){
 const t=data.find(x=>x.id===id),f=t.ada_foto?await get('foto',id):null;
 sheet(`<h3>${esc(t.nama)}</h3>${f?`<img class="ph" alt="Foto tamu" src="${URL.createObjectURL(f.blob)}">`:''}<dl>${[['Waktu masuk',fmt(t.waktu_masuk)],['Kategori',t.kategori],['Instansi',t.instansi],['Kecamatan',t.kecamatan],['No. HP',t.no_hp],['Bagian dituju',t.bagian],['Keperluan',t.keperluan],['Catatan',t.catatan],['Jumlah orang',t.jumlah]].filter(x=>x[1]).map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><button class="b2" id="bx" style="width:100%">Tutup</button>`)}
document.addEventListener('click',async e=>{
 const r=e.target.closest('.r');if(!r)return;const id=r.dataset.id,a=e.target.dataset.a,t=data.find(x=>x.id===id);
 if(!a)return detail(id);
 if(a==='edit')return form(id);
 if(a==='hapus'){sheet(`<h3>Hapus data tamu?</h3><p>${esc(t.nama)} akan disembunyikan dari daftar. Data masih tersimpan dan bisa dipulihkan.</p><div class="row"><button class="b2" id="bx">Batal</button><button class="b" id="ok" style="background:var(--r)">Hapus</button></div>`);$('#ok').onclick=()=>mark(t,now());}
 if(a==='pulih')mark(t,'')});
async function mark(t,v){const n=now();await put('log',{id:uuid(),waktu:n,aksi:v?'hapus':'pulih',tamu_id:t.id,sebelum:JSON.stringify(t)});t.dihapus_pada=v;t.diubah_pada=n;await put('tamu',t);close();toast(v?'Data dihapus.':'Data dipulihkan.');load()}

// ===== Form tambah / edit =====
const opt=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
function form(id){
 const t=id?data.find(x=>x.id===id):{},e=!!id;pendingFoto=null;
 sheet(`<h3>${e?'Edit data tamu':'Tambah tamu'}</h3>
 <label>Nama *<input id="f_nama" value="${esc(t.nama)}" autocomplete="off"></label>
 <label>Kategori tamu *<select id="f_kat">${opt(KAT,t.kategori)}</select></label>
 <label id="w_ins">Nama instansi<input id="f_ins" value="${esc(t.instansi)}"></label>
 <label>Kecamatan asal<select id="f_kec"><option value="">Pilih kecamatan</option>${opt(KEC,t.kecamatan)}</select></label>
 <label>No. HP (opsional)<input id="f_hp" inputmode="tel" value="${esc(t.no_hp)}"></label>
 <label>Bagian yang dituju<select id="f_bag">${opt(BAG,t.bagian)}</select></label>
 <label>Keperluan<select id="f_kep">${opt(KEP,t.keperluan)}</select></label>
 <label>Catatan (opsional)<input id="f_cat" value="${esc(t.catatan)}"></label>
 <label>Jumlah orang<input id="f_jml" type="number" min="1" value="${t.jumlah||1}"></label>
 ${e?'':'<div id="fotoBox" style="margin-bottom:14px"><button class="b2" id="bf" style="width:100%">Ambil foto (opsional)</button></div>'}
 <div class="row"><button class="b2" id="bx">Batal</button><button class="b" id="bs">Simpan</button></div>`);
 const sync=()=>{$('#w_ins').hidden=$('#f_kat').value===KAT[0]};$('#f_kat').onchange=sync;sync();
 if(!e)$('#bf').onclick=camOpen;
 $('#bs').onclick=()=>save(id)}
async function save(id){
 const v=k=>$('#f_'+k).value.trim(),o={nama:v('nama'),kategori:v('kat'),instansi:v('ins'),kecamatan:v('kec'),no_hp:v('hp'),bagian:v('bag'),keperluan:v('kep'),catatan:v('cat'),jumlah:Math.max(1,+v('jml')||1)};
 if(!o.nama)return toast('Isi nama tamu.');
 if(o.kategori===KAT[0]){o.instansi='';if(!o.kecamatan)return toast('Pilih kecamatan asal.')}
 const n=now();let t;
 if(id){t=data.find(x=>x.id===id);await put('log',{id:uuid(),waktu:n,aksi:'edit',tamu_id:id,sebelum:JSON.stringify(t)});Object.assign(t,o,{diubah_pada:n})}
 else{t={id:uuid(),...o,waktu_masuk:n,dibuat_pada:n,diubah_pada:n,dihapus_pada:'',ada_foto:pendingFoto?1:0};if(pendingFoto)await put('foto',{id:t.id,blob:pendingFoto})}
 await put('tamu',t);pendingFoto=null;close();toast('Data tersimpan.');load()}
$('#fab').onclick=()=>form();

// ===== Kamera langsung (tanpa galeri) =====
async function camStart(){camStop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face}},audio:false});$('#cv').srcObject=stream}catch{camClose();toast('Kamera tidak bisa dibuka. Cek izin kamera. Tamu tetap bisa disimpan tanpa foto.')}}
function camStop(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
function camClose(){camStop();$('#cam').hidden=true}
function camOpen(){$('#cam').hidden=false;camMode(0);camStart()}
function camMode(done){$('#cv').hidden=!!done;$('#cp').hidden=!done;$('#c1').hidden=!!done;$('#c2').hidden=!done}
$('#flip').onclick=()=>{face=face==='environment'?'user':'environment';camStart()};
$('#cx').onclick=camClose;$('#redo').onclick=()=>{shot=null;camMode(0)};
$('#snap').onclick=()=>{const v=$('#cv');if(!v.videoWidth)return;const c=document.createElement('canvas'),s=Math.min(1,800/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{shot=b;$('#cp').src=URL.createObjectURL(b);camMode(1)},'image/jpeg',.75)};
$('#use').onclick=()=>{pendingFoto=shot;const u=URL.createObjectURL(shot);camClose();$('#fotoBox').innerHTML=`<img class="th" alt="Foto siap" src="${u}"><button class="b2" id="bf">Ambil ulang</button>`;$('#bf').onclick=camOpen};

// ===== Laporan, export, backup =====
const rng=()=>data.filter(t=>!t.dihapus_pada&&t.waktu_masuk.slice(0,10)>=$('#lf').value&&t.waktu_masuk.slice(0,10)<=$('#lu').value).reverse();
function renderLapor(){const a=rng();$('#cn').textContent=a.length+' kunjungan';
 $('#rt').innerHTML=`<thead><tr><th>No</th><th>Waktu masuk</th><th>Nama</th><th>Kategori</th><th>Kecamatan</th><th>Bagian</th><th>Keperluan</th><th>Jml</th></tr></thead><tbody>${a.map((t,i)=>`<tr><td>${i+1}</td><td>${fmt(t.waktu_masuk)}</td><td>${esc(t.nama)}</td><td>${esc(t.kategori)}</td><td>${esc(t.kecamatan)}</td><td>${esc(t.bagian)}</td><td>${esc(t.keperluan)}</td><td>${t.jumlah}</td></tr>`).join('')}</tbody>`}
const xl=()=>typeof XLSX!=='undefined'||(toast('Library Excel belum termuat. Buka aplikasi sekali dengan internet.'),false);
const out=(sh,name)=>{const wb=XLSX.utils.book_new();sh.forEach(([n,r,h])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r,h?{header:h}:undefined),n));XLSX.writeFile(wb,name)};
$('#xr').onclick=()=>{if(!xl())return;out([['Laporan',rng().map((t,i)=>({No:i+1,'Waktu masuk':fmt(t.waktu_masuk),Nama:t.nama,Kategori:t.kategori,Instansi:t.instansi,Kecamatan:t.kecamatan,'No. HP':t.no_hp,'Bagian dituju':t.bagian,Keperluan:t.keperluan,Catatan:t.catatan,'Jumlah orang':t.jumlah}))]],`Laporan_Tamu_${$('#lf').value}_${$('#lu').value}.xlsx`)};
$('#xb').onclick=async()=>{if(!xl())return;
 const C=['id','nama','kategori','instansi','kecamatan','no_hp','bagian','keperluan','catatan','jumlah','waktu_masuk','dibuat_pada','diubah_pada','dihapus_pada','ada_foto'];
 const rows=[...data].reverse().map(t=>Object.fromEntries(C.map(k=>[k,k==='ada_foto'?(t.ada_foto?'ya':'tidak'):k==='jumlah'?t.jumlah:String(t[k]??'')])));
 const lg=(await all('log')).map(l=>({id:l.id,waktu:l.waktu,aksi:l.aksi,tamu_id:l.tamu_id,sebelum:l.sebelum}));
 out([['Data',rows,C],['Log',lg,['id','waktu','aksi','tamu_id','sebelum']],['Meta',[{format:'bukutamu-v1',diekspor:now(),versi_app:'1.0',jumlah_baris:rows.length}]]],`Backup_BukuTamu_${now().slice(0,10)}.xlsx`)};
$('#pr').onclick=()=>print();
$('#lf').onchange=$('#lu').onchange=renderLapor;

// ===== Navigasi, kunci PIN, awal =====
document.querySelectorAll('#nav a[data-p]').forEach(a=>a.onclick=()=>{document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x===a));['data','kelola','lapor'].forEach(p=>$('#p-'+p).hidden=p!==a.dataset.p);$('#fab').hidden=a.dataset.p==='lapor'});
['q','d','q2','td'].forEach(i=>$('#'+i).oninput=render);
const hash=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bt1'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function lockInit(){const p=await get('set','pin');$('#lt').textContent=p?'Masukkan PIN':'Buat PIN baru';$('#ls').textContent=p?'':'Minimal 4 angka. Catat PIN di tempat aman.';$('#pin').value='';$('#lock').hidden=false;
 $('#pb').onclick=async()=>{const v=$('#pin').value;if(v.length<4)return toast('PIN minimal 4 angka.');const h=await hash(v);if(!p)await put('set',{k:'pin',h});else if(p.h!==h)return toast('PIN salah.');$('#lock').hidden=true;load()}}
$('#kunci').onclick=lockInit;
const today=now().slice(0,10);$('#d').value=today;$('#lu').value=today;$('#lf').value=today.slice(0,8)+'01';
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
lockInit();
</script></body></html>
